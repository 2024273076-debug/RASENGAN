<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rasengan - Naruto Visual Effect</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            overflow: hidden;
            user-select: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }
        /* Custom UI Glow Effects */
        .glow-text {
            text-shadow: 0 0 12px rgba(6, 182, 212, 0.8), 0 0 24px rgba(59, 130, 246, 0.6);
        }
        .glow-box {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.25), inset 0 0 15px rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(30, 41, 59, 0.8);
            height: 6px;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px #38bdf8;
            transition: all 0.2s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            scale: 1.2;
            background: #7dd3fc;
            box-shadow: 0 0 15px #38bdf8;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col h-screen w-screen relative">

    <!-- Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 cursor-grab active:cursor-grabbing"></div>

    <!-- UI Overlay Header -->
    <header class="absolute top-0 left-0 right-0 p-4 md:p-6 flex justify-between items-center pointer-events-none z-10">
        <div>
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-widest mb-1">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Chakra Simulator
            </div>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-wider font-orbitron bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500 glow-text">
                RASENGAN <span class="text-xs text-cyan-300 font-sans tracking-normal align-top px-2 py-0.5 rounded bg-cyan-900/40 border border-cyan-500/30">螺旋丸</span>
            </h1>
            <p class="text-xs md:text-sm text-cyan-200/70 font-medium">Spiral Sphere Visualizer - High Density Chakra Field</p>
        </div>
        <div class="hidden sm:flex gap-2 pointer-events-auto">
            <button id="btn-reset" class="glass-panel px-4 py-2 rounded-lg text-xs font-semibold text-cyan-300 hover:bg-cyan-900/40 hover:text-white transition flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> Reset View
            </button>
            <button id="btn-burst" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs tracking-wider uppercase transition shadow-[0_0_15px_rgba(6,182,212,0.5)] active:scale-95 flex items-center gap-2">
                <i class="fa-solid fa-bolt"></i> Release Burst
            </button>
        </div>
    </header>

    <!-- Control Dashboard Overlay -->
    <div class="absolute bottom-4 left-4 right-4 md:left-6 md:right-auto md:w-80 glass-panel rounded-2xl p-4 md:p-5 z-10 flex flex-col gap-4 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
            <span class="font-orbitron text-sm text-cyan-300 font-bold tracking-wide flex items-center gap-2">
                <i class="fa-solid fa-sliders text-cyan-400"></i> CONTROL MATRIX
            </span>
            <span id="fps-display" class="text-xs text-cyan-400/70 font-mono">60 FPS</span>
        </div>

        <!-- Slider: Rotation Speed -->
        <div class="space-y-1">
            <div class="flex justify-between text-xs font-semibold">
                <label for="speed-slider" class="text-slate-300">Spin Velocity</label>
                <span id="speed-val" class="text-cyan-400">1.0x</span>
            </div>
            <input type="range" id="speed-slider" min="0.2" max="3.0" step="0.1" value="1.0" class="w-full">
        </div>

        <!-- Slider: Particle Density -->
        <div class="space-y-1">
            <div class="flex justify-between text-xs font-semibold">
                <label for="density-slider" class="text-slate-300">Chakra Intensity</label>
                <span id="density-val" class="text-cyan-400">100%</span>
            </div>
            <input type="range" id="density-slider" min="0.3" max="2.0" step="0.1" value="1.0" class="w-full">
        </div>

        <!-- Slider: Sphere Radius -->
        <div class="space-y-1">
            <div class="flex justify-between text-xs font-semibold">
                <label for="size-slider" class="text-slate-300">Sphere Scale</label>
                <span id="size-val" class="text-cyan-400">1.0x</span>
            </div>
            <input type="range" id="size-slider" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full">
        </div>

        <!-- Color Palette Toggle -->
        <div class="space-y-1.5">
            <label class="text-xs font-semibold text-slate-300 block">Chakra Variation</label>
            <div class="grid grid-cols-3 gap-2">
                <button class="color-mode-btn active glass-panel py-1.5 rounded text-xs font-semibold text-cyan-300 border-cyan-400 bg-cyan-500/20" data-mode="classic">Classic</button>
                <button class="color-mode-btn glass-panel py-1.5 rounded text-xs font-semibold text-purple-300 hover:text-purple-200" data-mode="sage">Sage Mode</button>
                <button class="color-mode-btn glass-panel py-1.5 rounded text-xs font-semibold text-amber-300 hover:text-amber-200" data-mode="nineTails">Kyuubi</button>
            </div>
        </div>

        <!-- Mobile Release Burst Button -->
        <button id="btn-burst-mobile" class="sm:hidden w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold py-2.5 rounded-lg text-xs uppercase tracking-wider shadow-[0_0_15px_rgba(6,182,212,0.5)] active:scale-95 flex justify-center items-center gap-2">
            <i class="fa-solid fa-bolt"></i> Release Chakra Burst
        </button>
    </div>

    <!-- Interaction Hint Banner -->
    <div class="absolute bottom-4 right-6 hidden md:flex items-center gap-3 text-xs text-cyan-200/60 glass-panel px-4 py-2 rounded-full pointer-events-none">
        <span><i class="fa-solid fa-mouse-pointer text-cyan-400"></i> Drag to Rotate</span>
        <span>•</span>
        <span><i class="fa-solid fa-hand-pointer text-cyan-400"></i> Click/Tap Canvas to Blast</span>
    </div>

    <script>
        window.onload = function() {
            // Main App Configuration State
            const state = {
                speed: 1.0,
                intensity: 1.0,
                scale: 1.0,
                mode: 'classic', // classic, sage, nineTails
                colors: {
                    classic: { core: 0xffffff, main: 0x00d2ff, outer: 0x0055ff, particle: 0x88f0ff },
                    sage: { core: 0xffffff, main: 0x00f0ff, outer: 0x00aaff, particle: 0x70ffff },
                    nineTails: { core: 0xffffff, main: 0xff3300, outer: 0xaa0000, particle: 0xffaa00 }
                }
            };

            // Canvas & Renderer Setup
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.03);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Container group for Rasengan components
            const rasenganGroup = new THREE.Group();
            scene.add(rasenganGroup);

            // Custom Fresnel Outer Aura Shader
            const auraVertexShader = `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;

            const auraFragmentShader = `
                uniform vec3 uColor;
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vPosition;
                
                // Simplex noise helper function
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                
                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy));
                    vec3 x0 = v - i + dot(i, C.xxx);
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min(g.xyz, l.zxy);
                    vec3 i2 = max(g.xyz, l.zxy);
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i);
                    vec4 p = permute(permute(permute(
                                i.z + vec4(0.0, i1.z, i2.z, 1.0))
                            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                    float n_ = 0.142857142857;
                    vec3 ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_);
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4(x.xy, y.xy);
                    vec4 b1 = vec4(x.zw, y.zw);
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                    vec3 p0 = vec3(a0.xy, h.x);
                    vec3 p1 = vec3(a0.zw, h.y);
                    vec3 p2 = vec3(a1.xy, h.z);
                    vec3 p3 = vec3(a1.zw, h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
                }

                void main() {
                    vec3 viewDir = normalize(-vPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 2.5);
                    float noise = snoise(vPosition * 2.5 + vec3(0.0, uTime * 3.0, 0.0)) * 0.35;
                    float alpha = clamp(fresnel + noise, 0.0, 1.0);
                    gl_FragColor = vec4(uColor * (1.2 + noise), alpha * 0.75);
                }
            `;

            // 1. Core Glowing Sphere
            const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({
                color: state.colors.classic.core,
                transparent: true,
                opacity: 0.95
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            rasenganGroup.add(coreMesh);

            // 2. High-Density Inner Shell
            const innerGeo = new THREE.SphereGeometry(1.6, 32, 32);
            const innerMat = new THREE.MeshBasicMaterial({
                color: state.colors.classic.main,
                transparent: true,
                opacity: 0.45,
                wireframe: true
            });
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            rasenganGroup.add(innerMesh);

            // 3. Dynamic Outer Aura Shader Mesh
            const auraGeo = new THREE.SphereGeometry(2.1, 48, 48);
            const auraUniforms = {
                uColor: { value: new THREE.Color(state.colors.classic.main) },
                uTime: { value: 0 }
            };
            const auraMat = new THREE.ShaderMaterial({
                vertexShader: auraVertexShader,
                fragmentShader: auraFragmentShader,
                uniforms: auraUniforms,
                transparent: true,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const auraMesh = new THREE.Mesh(auraGeo, auraMat);
            rasenganGroup.add(auraMesh);

            // 4. Swirling Chakra Particle Field
            const particleCount = 2800;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const radii = new Float32Array(particleCount);
            const angles = new Float32Array(particleCount);
            const speeds = new Float32Array(particleCount);
            const yPositions = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const r = 1.3 + Math.random() * 1.5;
                const angle = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 3.2;

                radii[i] = r;
                angles[i] = angle;
                speeds[i] = 2.0 + Math.random() * 4.0;
                yPositions[i] = y;

                positions[i * 3] = r * Math.cos(angle);
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = r * Math.sin(angle);
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // Custom Soft Glow Particle Texture
            const createParticleCanvas = () => {
                const cv = document.createElement('canvas');
                cv.width = 64; cv.height = 64;
                const ctx = cv.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.3, 'rgba(0, 210, 255, 0.8)');
                grad.addColorStop(0.8, 'rgba(0, 100, 255, 0.2)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 64, 64);
                return cv;
            };

            const particleTexture = new THREE.CanvasTexture(createParticleCanvas());
            const particleMat = new THREE.PointsMaterial({
                size: 0.22,
                map: particleTexture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                color: state.colors.classic.particle
            });

            const particleSystem = new THREE.Points(particleGeo, particleMat);
            rasenganGroup.add(particleSystem);

            // 5. Swirling Spiral Rings (High Speed Chakra Stream Bands)
            const ringGroup = new THREE.Group();
            const ringCount = 12;
            const rings = [];

            for (let i = 0; i < ringCount; i++) {
                const ringGeo = new THREE.TorusGeometry(1.6 + Math.random() * 0.4, 0.02 + Math.random() * 0.02, 12, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: i % 2 === 0 ? state.colors.classic.main : state.colors.classic.outer,
                    transparent: true,
                    opacity: 0.75,
                    blending: THREE.AdditiveBlending
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.random() * Math.PI;
                ringMesh.rotation.y = Math.random() * Math.PI;
                
                rings.push({
                    mesh: ringMesh,
                    rotSpeedX: (Math.random() - 0.5) * 0.1,
                    rotSpeedY: (Math.random() - 0.5) * 0.1,
                    rotSpeedZ: (0.05 + Math.random() * 0.08) * (Math.random() > 0.5 ? 1 : -1)
                });
                ringGroup.add(ringMesh);
            }
            rasenganGroup.add(ringGroup);

            // 6. Lightning Arcs Generator
            const lightningGroup = new THREE.Group();
            rasenganGroup.add(lightningGroup);

            function createLightningArc() {
                const points = [];
                const start = new THREE.Vector3(0, 0, 0);
                const end = new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 4
                ).normalize().multiplyScalar(1.8 + Math.random() * 0.8);

                const segments = 8;
                for (let i = 0; i <= segments; i++) {
                    const alpha = i / segments;
                    const p = new THREE.Vector3().lerpVectors(start, end, alpha);
                    if (i > 0 && i < segments) {
                        p.x += (Math.random() - 0.5) * 0.4;
                        p.y += (Math.random() - 0.5) * 0.4;
                        p.z += (Math.random() - 0.5) * 0.4;
                    }
                    points.push(p);
                }

                const arcGeo = new THREE.BufferGeometry().setFromPoints(points);
                const arcMat = new THREE.LineBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.9,
                    linewidth: 2
                });
                const arcMesh = new THREE.Line(arcGeo, arcMat);
                arcMesh.userData = { life: 1.0 };
                lightningGroup.add(arcMesh);
            }

            // 7. Shockwave Burst Effect Array
            const burstRings = [];
            function triggerChakraBurst() {
                const burstGeo = new THREE.RingGeometry(0.2, 0.5, 32);
                const burstMat = new THREE.MeshBasicMaterial({
                    color: state.colors[state.mode].main,
                    transparent: true,
                    opacity: 1.0,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending
                });
                const burstMesh = new THREE.Mesh(burstGeo, burstMat);
                burstMesh.rotation.x = Math.PI / 2;
                burstMesh.position.set(0, 0, 0);
                scene.add(burstMesh);

                burstRings.push({
                    mesh: burstMesh,
                    scale: 1.0,
                    opacity: 1.0
                });

                // Flash scale up temporarily
                rasenganGroup.scale.set(state.scale * 1.35, state.scale * 1.35, state.scale * 1.35);
                setTimeout(() => {
                    rasenganGroup.scale.set(state.scale, state.scale, state.scale);
                }, 150);

                // Spawn multiple lightning arcs
                for(let i=0; i<8; i++) createLightningArc();
            }

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(state.colors.classic.main, 4, 15);
            rasenganGroup.add(pointLight);

            // Interactive Mouse Orbit Camera Controls
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let targetRotationX = 0;
            let targetRotationY = 0;

            const onPointerDown = (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
            };

            const onPointerMove = (e) => {
                if (!isDragging) return;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                if (!clientX || !clientY) return;

                const deltaX = clientX - previousMousePosition.x;
                const deltaY = clientY - previousMousePosition.y;

                targetRotationY += deltaX * 0.008;
                targetRotationX += deltaY * 0.008;

                previousMousePosition = { x: clientX, y: clientY };
            };

            const onPointerUp = () => { isDragging = false; };

            window.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            window.addEventListener('touchstart', onPointerDown);
            window.addEventListener('touchmove', onPointerMove);
            window.addEventListener('touchend', onPointerUp);

            // Canvas Click to Release Burst
            container.addEventListener('click', (e) => {
                // Prevent burst if click originated from UI controls panel
                if (e.target.closest('.glass-panel')) return;
                triggerChakraBurst();
            });

            // UI Elements & Controls Listeners
            const speedSlider = document.getElementById('speed-slider');
            const densitySlider = document.getElementById('density-slider');
            const sizeSlider = document.getElementById('size-slider');

            speedSlider.addEventListener('input', (e) => {
                state.speed = parseFloat(e.target.value);
                document.getElementById('speed-val').innerText = state.speed.toFixed(1) + 'x';
            });

            densitySlider.addEventListener('input', (e) => {
                state.intensity = parseFloat(e.target.value);
                document.getElementById('density-val').innerText = Math.round(state.intensity * 100) + '%';
                particleMat.size = 0.22 * state.intensity;
            });

            sizeSlider.addEventListener('input', (e) => {
                state.scale = parseFloat(e.target.value);
                document.getElementById('size-val').innerText = state.scale.toFixed(1) + 'x';
                rasenganGroup.scale.set(state.scale, state.scale, state.scale);
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                targetRotationX = 0;
                targetRotationY = 0;
                state.speed = 1.0;
                state.intensity = 1.0;
                state.scale = 1.0;
                speedSlider.value = 1.0;
                densitySlider.value = 1.0;
                sizeSlider.value = 1.0;
                document.getElementById('speed-val').innerText = '1.0x';
                document.getElementById('density-val').innerText = '100%';
                document.getElementById('size-val').innerText = '1.0x';
                rasenganGroup.scale.set(1, 1, 1);
            });

            document.getElementById('btn-burst').addEventListener('click', triggerChakraBurst);
            document.getElementById('btn-burst-mobile').addEventListener('click', triggerChakraBurst);

            // Color Mode Switcher
            const colorBtns = document.querySelectorAll('.color-mode-btn');
            colorBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    colorBtns.forEach(b => b.classList.remove('active', 'border-cyan-400', 'bg-cyan-500/20', 'bg-purple-500/20', 'bg-amber-500/20'));
                    const mode = e.target.dataset.mode;
                    state.mode = mode;
                    
                    const theme = state.colors[mode];
                    coreMat.color.setHex(theme.core);
                    innerMat.color.setHex(theme.main);
                    auraUniforms.uColor.value.setHex(theme.main);
                    particleMat.color.setHex(theme.particle);
                    pointLight.color.setHex(theme.main);

                    rings.forEach((r, idx) => {
                        r.mesh.material.color.setHex(idx % 2 === 0 ? theme.main : theme.outer);
                    });

                    if (mode === 'classic') e.target.classList.add('border-cyan-400', 'bg-cyan-500/20');
                    if (mode === 'sage') e.target.classList.add('border-purple-400', 'bg-purple-500/20');
                    if (mode === 'nineTails') e.target.classList.add('border-amber-400', 'bg-amber-500/20');
                });
            });

            // Handle Screen Resizing
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Performance FPS Tracker
            let lastTime = performance.now();
            let frameCount = 0;
            const fpsDisplay = document.getElementById('fps-display');

            const clock = new THREE.Clock();

            // Main Animation Loop
            function animate() {
                requestAnimationFrame(animate);

                const elapsedTime = clock.getElapsedTime();
                const delta = clock.getDelta();

                // FPS Counter Logic
                frameCount++;
                const now = performance.now();
                if (now - lastTime >= 1000) {
                    fpsDisplay.innerText = `${frameCount} FPS`;
                    frameCount = 0;
                    lastTime = now;
                }

                // Smooth Rotation Interpolation (Damping)
                rasenganGroup.rotation.y += (targetRotationY - rasenganGroup.rotation.y) * 0.05;
                rasenganGroup.rotation.x += (targetRotationX - rasenganGroup.rotation.x) * 0.05;

                // Update Shader Uniforms
                auraUniforms.uTime.value = elapsedTime * state.speed;

                // Animate Core Pulsing
                const pulse = 1.0 + Math.sin(elapsedTime * 8.0 * state.speed) * 0.04;
                coreMesh.scale.set(pulse, pulse, pulse);
                innerMesh.rotation.y += 0.04 * state.speed;
                innerMesh.rotation.z += 0.02 * state.speed;

                // Animate Particles Swirling
                const pos = particleGeo.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    angles[i] += 0.02 * speeds[i] * state.speed;
                    const r = radii[i];
                    pos[i * 3] = r * Math.cos(angles[i]);
                    pos[i * 3 + 2] = r * Math.sin(angles[i]);
                    
                    // Minor vertical turbulence
                    pos[i * 3 + 1] = yPositions[i] + Math.sin(elapsedTime * 3.0 + i) * 0.15;
                }
                particleGeo.attributes.position.needsUpdate = true;
                particleSystem.rotation.y += 0.01 * state.speed;

                // Animate High-Speed Chakra Arc Rings
                rings.forEach(r => {
                    r.mesh.rotation.x += r.rotSpeedX * state.speed * 2.5;
                    r.mesh.rotation.y += r.rotSpeedY * state.speed * 2.5;
                    r.mesh.rotation.z += r.rotSpeedZ * state.speed * 2.5;
                });

                // Spawn Random Lightning Arcs dynamically
                if (Math.random() < 0.25 * state.speed) {
                    createLightningArc();
                }

                // Update Lightning Arc Lifespans
                for (let i = lightningGroup.children.length - 1; i >= 0; i--) {
                    const arc = lightningGroup.children[i];
                    arc.userData.life -= 0.08;
                    arc.material.opacity = arc.userData.life;
                    if (arc.userData.life <= 0) {
                        lightningGroup.remove(arc);
                        arc.geometry.dispose();
                        arc.material.dispose();
                    }
                }

                // Animate Shockwave Bursts
                for (let i = burstRings.length - 1; i >= 0; i--) {
                    const b = burstRings[i];
                    b.scale += 0.25;
                    b.opacity -= 0.035;
                    b.mesh.scale.set(b.scale, b.scale, b.scale);
                    b.mesh.material.opacity = b.opacity;

                    if (b.opacity <= 0) {
                        scene.remove(b.mesh);
                        b.mesh.geometry.dispose();
                        b.mesh.material.dispose();
                        burstRings.splice(i, 1);
                    }
                }

                // Render Scene
                renderer.render(scene, camera);
            }

            // Start Animation Loop on load
            animate();
        };
    </script>
</body>
</html>
